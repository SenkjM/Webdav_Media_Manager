name: openlist_crypt
description: >-
  Pure-Dart implementation of the rclone/OpenList "crypt" encrypted-storage
  format: scrypt key derivation, EME filename encryption, XSalsa20-Poly1305
  content blocks, and base32/base64/base32768 filename encodings. Wire
  compatible with rclone backend/crypt and OpenList/Alist crypt storage.
version: 0.2.0
publish_to: none
repository: https://github.com/SenkjM/Webdav_Media_Manager
issue_tracker: https://github.com/SenkjM/Webdav_Media_Manager/issues
# The package targets Dart (no Flutter); it stays usable from Flutter apps.
environment:
  sdk: ^3.5.0

dependencies:
  pointycastle: ^4.0.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0

# This package is developed in-tree next to the app that consumes it; when it
# moves to its own repository, drop `publish_to: none` and add topics/homepage.
