name: Android Build & Pre-release

on:
  push:
    branches: [main, master, beta, dev]
  schedule:
    # 每天约北京时间 00:00：检查 beta 是否有相对 prerelease 的新提交
    - cron: "0 16 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main, master, beta]

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.event_name == 'schedule' && 'beta' || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 定时任务固定检视 beta；其余事件用触发引用
          ref: ${{ github.event_name == 'schedule' && 'beta' || github.ref }}

      - name: Decide whether to publish pre-release
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EVENT="${{ github.event_name }}"
          BRANCH="${{ github.ref_name }}"
          if [ "$EVENT" = "schedule" ]; then
            BRANCH="beta"
          fi
          echo "event=$EVENT branch=$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          # PR：只构建
          if [ "$EVENT" = "pull_request" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "reason=pull_request" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Pre-release 仅从 beta 发布
          if [ "$BRANCH" != "beta" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "reason=not_beta_branch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # beta + 手动：强制发
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "reason=workflow_dispatch_beta" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # beta + push：发
          if [ "$EVENT" = "push" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "reason=push_beta" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 定时：仅当 beta HEAD 相对 prerelease 标签有变动
          if [ "$EVENT" = "schedule" ]; then
            if git rev-parse -q --verify refs/tags/prerelease >/dev/null; then
              LAST=$(git rev-parse prerelease)
              HEAD=$(git rev-parse HEAD)
              echo "last_prerelease=$LAST head=$HEAD"
              if [ "$LAST" = "$HEAD" ]; then
                echo "publish=false" >> "$GITHUB_OUTPUT"
                echo "reason=schedule_no_changes_on_beta" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            else
              echo "No existing prerelease tag; will publish from beta."
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "reason=schedule_beta_has_changes" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "publish=false" >> "$GITHUB_OUTPUT"
          echo "reason=unknown_event" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Build app bundle (optional)
        run: flutter build appbundle --release
        continue-on-error: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore

      - name: Skip publish notice
        if: steps.gate.outputs.publish != 'true'
        run: |
          echo "Skip GitHub Pre-release (reason=${{ steps.gate.outputs.reason }}, branch=${{ steps.gate.outputs.branch }})."

      - name: Create / update Pre-release
        if: steps.gate.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prerelease
          name: Pre-release (beta) ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          target_commitish: beta
          body: |
            自动构建的 Pre-release（来自 **beta** 分支，AGPL-3.0）。

            - 触发：`${{ github.event_name }}`（${{ steps.gate.outputs.reason }}）
            - Commit：`${{ github.sha }}`
            - 分支：`beta`

            APK 为 CI 默认签名，仅供内测安装。
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
