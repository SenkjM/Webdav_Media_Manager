name: Android Build & Pre-release

on:
  # 不在 push 时构建；未手动触发则等定时
  schedule:
    # 每天约北京时间 00:00：检查 beta 是否有相对 prerelease 的新提交
    - cron: "0 16 * * *"
  # 手动发版：GitHub UI 选择 beta 再 Run workflow
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（留空 = 用 pubspec 版本 + 短提交哈希，例如 1.2.0；填写则原样使用）"
        required: false
        type: string
      version_code:
        description: "versionCode（留空 = 1000 + 运行序号，保证单调递增可覆盖安装）"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.event_name == 'schedule' && 'beta' || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # 定时任务固定检视 beta；其余事件用触发引用
          ref: ${{ github.event_name == 'schedule' && 'beta' || github.ref }}

      - name: Decide whether to publish pre-release
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EVENT="${{ github.event_name }}"
          BRANCH="${{ github.ref_name }}"
          if [ "$EVENT" = "schedule" ]; then
            BRANCH="beta"
          fi
          echo "event=$EVENT branch=$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          # PR：只构建
          if [ "$EVENT" = "pull_request" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "reason=pull_request" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Pre-release 仅从 beta 发布；其他引用照样构建，只告警不终止
          if [ "$BRANCH" != "beta" ]; then
            if [ "$EVENT" = "workflow_dispatch" ]; then
              echo "::warning::预发布只从 beta 发布（当前引用 $BRANCH）：本次只构建、不发 Pre-release。正式版请用 workflow「Android Release (from main)」。"
            fi
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "reason=not_beta_branch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # beta + 手动：强制发
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "reason=workflow_dispatch_beta" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # beta + push：发
          if [ "$EVENT" = "push" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "reason=push_beta" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 定时：仅当 beta HEAD 相对 prerelease 标签有变动
          if [ "$EVENT" = "schedule" ]; then
            if git rev-parse -q --verify refs/tags/prerelease >/dev/null; then
              LAST=$(git rev-parse prerelease)
              HEAD=$(git rev-parse HEAD)
              echo "last_prerelease=$LAST head=$HEAD"
              if [ "$LAST" = "$HEAD" ]; then
                echo "publish=false" >> "$GITHUB_OUTPUT"
                echo "reason=schedule_no_changes_on_beta" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            else
              echo "No existing prerelease tag; will publish from beta."
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "reason=schedule_beta_has_changes" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "publish=false" >> "$GITHUB_OUTPUT"
          echo "reason=unknown_event" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          # Cache Gradle/AGP compile dependencies (android/gradle wrapper).
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install Android SDK compile dependencies
        # android/app/build.gradle.kts consumes Flutter's defaults
        # (compileSdk/targetSdk 36) with AGP 9.1 + Gradle 9.3.1, so install the
        # SDK components the Android build resolves instead of relying on the
        # runner image. JDK stays 17 (matches AGP 9 / Kotlin jvmTarget 17 and
        # the desugaring that flutter_local_notifications requires).
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found; leaving SDK components to Gradle."
            exit 0
          fi
          # Accept any licenses Gradle's auto-download may still need.
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install libmpv (media_kit native backend for `flutter test` on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev mpv

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Compute pre-release version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          # pubspec version base before +build, e.g. 1.0.0+1 → 1.0.0
          BASE=$(grep -E '^version:' pubspec.yaml | head -1 | sed -E 's/^version:[[:space:]]*//; s/\+.*//; s/[[:space:]]*$//')
          if [ -z "$BASE" ]; then BASE="1.0.0"; fi

          # Manual run may type the version (and versionCode) in the UI.
          if [ -n "${INPUT_VERSION:-}" ]; then
            VERSION_NAME="$INPUT_VERSION"
            if ! printf '%s' "$VERSION_NAME" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}([-+][0-9A-Za-z.-]+)?$'; then
              echo "::error::version 不合法：$VERSION_NAME（示例 1.2.0 或 1.2.0-rc1）"
              exit 1
            fi
            echo "Using manual version: $VERSION_NAME"
          else
            # versionName: semver-friendly with short hash (Android versionName is free-form)
            VERSION_NAME="${BASE}-${SHORT_SHA}"
          fi

          if [ -n "${INPUT_CODE:-}" ]; then
            VERSION_CODE="$INPUT_CODE"
            if ! printf '%s' "$VERSION_CODE" | grep -Eq '^[0-9]+$'; then
              echo "::error::version_code 必须是整数：$VERSION_CODE"
              exit 1
            fi
          else
            # Monotonic versionCode: 1000 + run_number always increases across
            # workflow runs of this repository (pre-releases and releases share
            # the counter, so neither track can go backwards).
            VERSION_CODE=$((1000 + ${{ github.run_number }}))
          fi

          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=$VERSION_NAME VERSION_CODE=$VERSION_CODE"

      - name: Decode internal keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "Missing secret ANDROID_KEYSTORE_BASE64 — cannot produce a stable-signed APK."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/android/app/internal-release.jks"
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/internal-release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-name="${{ steps.ver.outputs.version_name }}" \
            --build-number="${{ steps.ver.outputs.version_code }}"

      - name: Build app bundle (optional)
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build appbundle --release \
            --build-name="${{ steps.ver.outputs.version_name }}" \
            --build-number="${{ steps.ver.outputs.version_code }}"
        continue-on-error: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore

      - name: Skip publish notice
        if: steps.gate.outputs.publish != 'true'
        run: |
          echo "Skip GitHub Pre-release (reason=${{ steps.gate.outputs.reason }}, branch=${{ steps.gate.outputs.branch }})."

      - name: Create / update Pre-release
        if: steps.gate.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: prerelease
          name: Pre-release ${{ steps.ver.outputs.version_name }} (${{ steps.ver.outputs.version_code }})
          prerelease: true
          generate_release_notes: true
          target_commitish: beta
          body: |
            自动构建的 Pre-release（来自 **beta** 分支，AGPL-3.0）。

            - 版本：`${{ steps.ver.outputs.version_name }}`（versionCode `${{ steps.ver.outputs.version_code }}`）
            - 短提交：`${{ steps.ver.outputs.short_sha }}`
            - 触发：`${{ github.event_name }}`（${{ steps.gate.outputs.reason }}）
            - Commit：`${{ github.sha }}`
            - 分支：`beta`

            versionCode 使用 `1000 + github.run_number` 单调递增，可直接覆盖安装旧预发布 APK，无需先卸载。
            APK 使用仓库配置的**固定内测 keystore** 签名，可覆盖安装（首次从旧 debug 包换过来需卸载一次）。
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
