name: Android Build

# 正式版的检查、编译与发版，同一流程内串行：check → build → release。
# 发版直接用同一次运行的产物，不再由 workflow_run 接续。编译步骤保持不变。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（必填，例如 0.1.0 或 v0.1.0；只给当前 main 打标签）"
        required: true
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: android-versioned-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-26.04
    outputs:
      proceed: ${{ steps.decision.outputs.proceed }}
      tag: ${{ steps.decision.outputs.tag }}
      version_name: ${{ steps.decision.outputs.version_name }}
      version_code: ${{ steps.decision.outputs.version_code }}
      short_sha: ${{ steps.decision.outputs.short_sha }}
      prev_tag: ${{ steps.decision.outputs.prev_tag }}
      compare: ${{ steps.decision.outputs.compare }}
      sha: ${{ steps.decision.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - name: Check release tag
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_MODE: release
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/version-gate.sh

  build:
    needs: check
    if: needs.check.outputs.proceed == 'true'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.check.outputs.sha }}

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install Android SDK compile dependencies
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found; leaving SDK components to Gradle."
            exit 0
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install libmpv (media_kit native backend for `flutter test` on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev mpv

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "Missing secret ANDROID_KEYSTORE_BASE64 — cannot produce a signed release."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/android/app/release.jks"
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-name="${{ needs.check.outputs.version_name }}" \
            --build-number="${{ needs.check.outputs.version_code }}"

      - name: Build app bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build appbundle --release \
            --build-name="${{ needs.check.outputs.version_name }}" \
            --build-number="${{ needs.check.outputs.version_code }}"

      - name: Rename artifacts with the version
        run: |
          set -euo pipefail
          V="${{ needs.check.outputs.version_name }}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/webdav-media-manager-${V}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/webdav-media-manager-${V}.aab"
          {
            printf 'tag=%s\n' "${{ needs.check.outputs.tag }}"
            printf 'version_name=%s\n' "${{ needs.check.outputs.version_name }}"
            printf 'version_code=%s\n' "${{ needs.check.outputs.version_code }}"
            printf 'short_sha=%s\n' "${{ needs.check.outputs.short_sha }}"
            printf 'prev_tag=%s\n' "${{ needs.check.outputs.prev_tag }}"
            printf 'compare=%s\n' "${{ needs.check.outputs.compare }}"
            printf 'sha=%s\n' "${{ needs.check.outputs.sha }}"
          } > dist/meta.env

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: dist
          if-no-files-found: error
  release:
    needs: [check, build]
    if: needs.check.outputs.proceed == 'true'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: main

      - name: Download release bundle
        uses: actions/download-artifact@v7
        with:
          name: release-bundle
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::缺少 secret RELEASE_TOKEN。目标提交相对默认分支改过 .github/workflows 时，GITHUB_TOKEN 不能创建 Release，需要带 Workflows 写权限的 token。"
            exit 1
          fi
          meta() { sed -n "s/^${1}=//p" dist/meta.env | head -n 1; }
          tag="$(meta tag)"
          version_name="$(meta version_name)"
          version_code="$(meta version_code)"
          prev_tag="$(meta prev_tag)"
          sha="$(meta sha)"
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; skip."
            exit 0
          fi
          changes="$(bash .github/scripts/commit-list.sh "$prev_tag" "$sha")"
          notes="$(mktemp)"
          {
            printf 'Webdav Media Manager\n\n'
            printf -- '- 版本：`%s`（versionCode `%s`）\n' "$version_name" "$version_code"
            printf -- '- 上一个正式版：`%s`\n\n' "${prev_tag:-无}"
            if [ -n "$prev_tag" ]; then
                printf '相对于上一版本 `%s`：\n\n%s\n' "$prev_tag" "$changes"
            else
                printf '本次变更：\n\n%s\n' "$changes"
            fi
          } > "$notes"
          gh release create "$tag" dist/*.apk dist/*.aab \
            --repo "$REPO" \
            --target "$sha" \
            --title "${version_name}" \
            --notes-file "$notes" \
            --latest
