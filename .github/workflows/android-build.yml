name: Android Build & Pre-release

# 每日构建。先检查合法正式标签和变化，通过后才编译。
# 没有合法 vX.Y.Z 时不构建，转 Issue 提醒。编译步骤保持不变。

on:
  schedule:
    # 每天约北京时间 00:00
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: android-versioned-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-26.04
    outputs:
      proceed: ${{ steps.decision.outputs.proceed }}
      version_name: ${{ steps.decision.outputs.version_name }}
      version_code: ${{ steps.decision.outputs.version_code }}
      short_sha: ${{ steps.decision.outputs.short_sha }}
      base_tag: ${{ steps.decision.outputs.base_tag }}
      sha: ${{ steps.decision.outputs.sha }}
      seq: ${{ steps.decision.outputs.seq }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event_name == 'schedule' && 'beta' || github.ref }}

      - name: Check whether a pre-release can run
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_MODE: prerelease
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/version-gate.sh

  build:
    needs: check
    if: needs.check.outputs.proceed == 'true'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.check.outputs.sha }}

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install Android SDK compile dependencies
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found; leaving SDK components to Gradle."
            exit 0
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install libmpv (media_kit native backend for `flutter test` on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev mpv

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Decode internal keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "Missing secret ANDROID_KEYSTORE_BASE64 — cannot produce a stable-signed APK."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/android/app/internal-release.jks"
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/internal-release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-name="${{ needs.check.outputs.version_name }}" \
            --build-number="${{ needs.check.outputs.version_code }}"

      - name: Build app bundle (optional)
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build appbundle --release \
            --build-name="${{ needs.check.outputs.version_name }}" \
            --build-number="${{ needs.check.outputs.version_code }}"
        continue-on-error: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore

      - name: Create / update Pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: prerelease
          name: Pre-release ${{ needs.check.outputs.version_name }} (${{ needs.check.outputs.version_code }})
          prerelease: true
          target_commitish: ${{ needs.check.outputs.sha }}
          body: |
            自动构建的 Pre-release（来自 **beta** 分支，AGPL-3.0）。

            - 版本：`${{ needs.check.outputs.version_name }}`（versionCode `${{ needs.check.outputs.version_code }}`）
            - 短提交：`${{ needs.check.outputs.short_sha }}`
            - 基准标签：`${{ needs.check.outputs.base_tag }}`
            - 触发：`${{ github.event_name }}`
            - Commit：`${{ needs.check.outputs.sha }}`
            - 分支：`beta`

            base_tag=${{ needs.check.outputs.base_tag }}
            seq=${{ needs.check.outputs.seq }}
            sha=${{ needs.check.outputs.sha }}

            versionCode 后三位在每个正式版之后从 001 递增，到 999 停止。
            APK 使用仓库配置的固定内测 keystore 签名。
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Record pre-release tag metadata
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.check.outputs.sha }}
          SEQ: ${{ needs.check.outputs.seq }}
          BASE: ${{ needs.check.outputs.base_tag }}
          NAME: ${{ needs.check.outputs.version_name }}
          CODE: ${{ needs.check.outputs.version_code }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a prerelease "$SHA" -f -m "version_name=${NAME}
          version_code=${CODE}
          base_tag=${BASE}
          seq=${SEQ}
          sha=${SHA}"
          git push origin refs/tags/prerelease --force
