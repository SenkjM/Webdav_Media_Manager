name: Android Build & Pre-release

on:
  push:
    branches: [main, master]
  schedule:
    # 每天 00:00（Asia/Shanghai，UTC+8）≈ 前一天 16:00 UTC
    - cron: "0 16 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: android-prerelease-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether to publish pre-release
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EVENT="${{ github.event_name }}"
          echo "event=$EVENT"

          # PR：只构建，不发 release
          if [ "$EVENT" = "pull_request" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "reason=pull_request" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 手动 / push：有变动即发（push 本身即变动；dispatch 强制发）
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$EVENT" = "push" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "reason=$EVENT" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 定时：仅当自上次 prerelease 以来有新提交才发
          if [ "$EVENT" = "schedule" ]; then
            if git rev-parse -q --verify refs/tags/prerelease >/dev/null; then
              LAST=$(git rev-parse prerelease)
              HEAD=$(git rev-parse HEAD)
              echo "last_prerelease=$LAST"
              echo "head=$HEAD"
              if [ "$LAST" = "$HEAD" ]; then
                echo "publish=false" >> "$GITHUB_OUTPUT"
                echo "reason=schedule_no_changes" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            else
              echo "No existing prerelease tag; will publish."
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "reason=schedule_has_changes" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "publish=false" >> "$GITHUB_OUTPUT"
          echo "reason=unknown_event" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Build app bundle (optional)
        run: flutter build appbundle --release
        continue-on-error: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore

      - name: Skip publish notice
        if: steps.gate.outputs.publish != 'true'
        run: |
          echo "Skip GitHub Pre-release (reason=${{ steps.gate.outputs.reason }})."

      - name: Create / update Pre-release
        if: steps.gate.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prerelease
          name: Pre-release ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          body: |
            自动构建的 Pre-release（AGPL-3.0）。

            - 触发：`${{ github.event_name }}`（${{ steps.gate.outputs.reason }}）
            - Commit：`${{ github.sha }}`
            - 分支：`${{ github.ref_name }}`

            APK 为 CI 默认签名，仅供内测安装。
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
