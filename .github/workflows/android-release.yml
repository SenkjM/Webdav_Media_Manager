name: Android Release (from main)

# 正式版由 vX.Y.Z 标签触发。手动只给当前 main 打标签，再走同一套检查。
# 编译步骤保持不变。非法标签保留，并用 Issue 通知；没有收件人则跳过通知。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（必填，例如 0.1.0 或 v0.1.0；只给当前 main 打标签）"
        required: true
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: android-versioned-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-26.04
    outputs:
      proceed: ${{ steps.decision.outputs.proceed }}
      tag: ${{ steps.decision.outputs.tag }}
      version_name: ${{ steps.decision.outputs.version_name }}
      version_code: ${{ steps.decision.outputs.version_code }}
      short_sha: ${{ steps.decision.outputs.short_sha }}
      prev_tag: ${{ steps.decision.outputs.prev_tag }}
      compare: ${{ steps.decision.outputs.compare }}
      sha: ${{ steps.decision.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - name: Check release tag
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_MODE: release
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/version-gate.sh

  build:
    needs: check
    if: needs.check.outputs.proceed == 'true'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.check.outputs.sha }}

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install Android SDK compile dependencies
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found; leaving SDK components to Gradle."
            exit 0
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install libmpv (media_kit native backend for `flutter test` on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev mpv

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "Missing secret ANDROID_KEYSTORE_BASE64 — cannot produce a signed release."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/android/app/release.jks"
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-name="${{ needs.check.outputs.version_name }}" \
            --build-number="${{ needs.check.outputs.version_code }}"

      - name: Build app bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build appbundle --release \
            --build-name="${{ needs.check.outputs.version_name }}" \
            --build-number="${{ needs.check.outputs.version_code }}"

      - name: Rename artifacts with the version
        run: |
          set -euo pipefail
          V="${{ needs.check.outputs.version_name }}"
          cp build/app/outputs/flutter-apk/app-release.apk "webdav-media-manager-${V}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "webdav-media-manager-${V}.aab"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: webdav-media-manager-${{ needs.check.outputs.version_name }}
          path: |
            webdav-media-manager-*.apk
            webdav-media-manager-*.aab
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: Webdav Media Manager ${{ needs.check.outputs.version_name }}
          target_commitish: ${{ needs.check.outputs.sha }}
          prerelease: false
          draft: false
          make_latest: true
          body: |
            正式版（来自 **main**，AGPL-3.0）。

            - 版本：`${{ needs.check.outputs.version_name }}`（versionCode `${{ needs.check.outputs.version_code }}`）
            - 短提交：`${{ needs.check.outputs.short_sha }}`
            - 完整提交：`${{ needs.check.outputs.sha }}`
            - 上一个正式版：`${{ needs.check.outputs.prev_tag || '（首个正式版）' }}`
            - ${{ needs.check.outputs.compare }}

            安装：APK 使用仓库配置的固定 keystore 签名，可直接覆盖安装（含预发布包）。
            包名 `com.senkjm.media_manager`。versionCode 由版本号编码，正式版后三位为 000。
          files: |
            webdav-media-manager-*.apk
            webdav-media-manager-*.aab
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
