name: Android Release

# 只负责正式版发版。编译在 Android Build，成功后由 workflow_run 接上。
# 没有 release-bundle 时直接跳过，不重复编译。
# 变更列表是上一正式版到本次正式版的提交，只写短哈希、链接和标题。

on:
  workflow_run:
    workflows: ["Android Build"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: android-release-publish
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    steps:
      - name: Decide whether a bundle exists
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          names="$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/artifacts" --jq '.artifacts[].name')"
          if printf '%s\n' "$names" | grep -qx 'release-bundle'; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "No release-bundle on run ${RUN_ID}; skip publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.publish == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: main

      - name: Download release bundle
        if: steps.gate.outputs.publish == 'true'
        uses: actions/download-artifact@v7
        with:
          name: release-bundle
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: dist

      - name: Create GitHub Release
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::缺少 secret RELEASE_TOKEN。目标提交相对默认分支改过 .github/workflows 时，GITHUB_TOKEN 不能创建 Release，需要带 Workflows 写权限的 token。"
            exit 1
          fi
          meta() { sed -n "s/^${1}=//p" dist/meta.env | head -n 1; }
          tag="$(meta tag)"
          version_name="$(meta version_name)"
          version_code="$(meta version_code)"
          prev_tag="$(meta prev_tag)"
          sha="$(meta sha)"
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; skip."
            exit 0
          fi
          changes="$(bash .github/scripts/commit-list.sh "$prev_tag" "$sha")"
          notes="$(mktemp)"
          {
            printf 'Webdav Media Manager\n\n'
            printf -- '- 版本：`%s`（versionCode `%s`）\n' "$version_name" "$version_code"
            printf -- '- 上一个正式版：`%s`\n\n' "${prev_tag:-无}"
            if [ -n "$prev_tag" ]; then
                printf '相对于上一版本 `%s`：\n\n%s\n' "$prev_tag" "$changes"
            else
                printf '本次变更：\n\n%s\n' "$changes"
            fi
          } > "$notes"
          gh release create "$tag" dist/*.apk dist/*.aab \
            --repo "$REPO" \
            --target "$sha" \
            --title "${version_name}" \
            --notes-file "$notes" \
            --latest
