name: Android Release

# 只负责正式版发版。编译在 Android Build，成功后由 workflow_run 接上。
# 没有 release-bundle 时直接跳过，不重复编译。

on:
  workflow_run:
    workflows: ["Android Build"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: android-release-publish
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    steps:
      - name: Decide whether a bundle exists
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          names="$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/artifacts" --jq '.artifacts[].name')"
          if printf '%s\n' "$names" | grep -qx 'release-bundle'; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "No release-bundle on run ${RUN_ID}; skip publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release bundle
        if: steps.gate.outputs.publish == 'true'
        uses: actions/download-artifact@v7
        with:
          name: release-bundle
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: dist

      - name: Create GitHub Release
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          meta() { sed -n "s/^${1}=//p" dist/meta.env | head -n 1; }
          tag="$(meta tag)"
          version_name="$(meta version_name)"
          version_code="$(meta version_code)"
          short_sha="$(meta short_sha)"
          prev_tag="$(meta prev_tag)"
          compare="$(meta compare)"
          sha="$(meta sha)"
          if [ -z "$prev_tag" ]; then prev_tag="（首个正式版）"; fi
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; skip."
            exit 0
          fi
          notes="$(mktemp)"
          cat > "$notes" <<EOF
          正式版（来自 **main**，AGPL-3.0）。

          - 版本：\`${version_name}\`（versionCode \`${version_code}\`）
          - 短提交：\`${short_sha}\`
          - 完整提交：\`${sha}\`
          - 上一个正式版：\`${prev_tag}\`
          - ${compare}

          安装：APK 使用仓库配置的固定 keystore 签名，可直接覆盖安装（含预发布包）。
          包名 \`com.senkjm.media_manager\`。versionCode 由版本号编码，正式版后三位为 000。
          EOF
          gh release create "$tag" dist/*.apk dist/*.aab \
            --repo "$REPO" \
            --target "$sha" \
            --title "Webdav Media Manager ${version_name}" \
            --notes-file "$notes" \
            --latest
