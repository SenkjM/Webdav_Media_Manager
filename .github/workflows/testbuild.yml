name: Testbuild

# 手动旁路编译：只出 sandbox flavor 的 arm64-v8a APK，上传 Actions artifact。
# Rust FFI（默认路径）：从 SenkjM/WDMM-core 的 native-artifacts workflow 下载
#   libwdmm_ffi.so（artifact: wdmm-ffi-android-arm64），按子模块 SHA 精确匹配。
#   如需在本机重新编译 Core，将 build_core_locally 设为 true（需要 NDK + cargo-ndk）。
# 消费链：先在 Core 仓库触发 native-artifacts (feat/proxy-hls-ffmpeg) → 再触发本 workflow。
#   本 workflow 下载与子模块 SHA 完全吻合的产物；若找不到则报错，不会静默回退到错误版本。
# 不打标签、不建 GitHub Release、不打 app bundle，也不跑预发布的定时任务。
# 版本：versionName = 最新正式版标签 + "-" + 7 位短哈希（如 v0.2.3-055ee9c，
#   sandbox flavor 再追加 versionNameSuffix "-test"）；
#   versionCode = 该标签的正式版 versionCode（主×1e8 + 次×1e6 + 修订×1e4）+ 本 workflow 的 run_number。
#   sandbox 包名独立（.test），不与 prod 的 versionCode 冲突；run_number 单调递增，便于覆盖安装。
# 签名：sandbox flavor 用固定测试 keystore（Secrets：ANDROID_SANDBOX_KEYSTORE_BASE64 /
#   ANDROID_SANDBOX_KEYSTORE_PASSWORD / ANDROID_SANDBOX_KEY_ALIAS / ANDROID_SANDBOX_KEY_PASSWORD），
#   与正式 / 预发布的 ANDROID_KEY* / ANDROID_KEYSTORE_* 分开；跨次可覆盖安装 .test 包。
# 跨仓库 artifact 鉴权：优先使用 WDMM_CORE_READ_TOKEN（对 SenkjM/WDMM-core 具备
#   actions:read 权限的 PAT）；如果两个仓库在同一用户/组织且 artifact 可见，GITHUB_TOKEN 亦可。

on:
  workflow_dispatch:
    inputs:
      build_core_locally:
        description: "Recompile wdmm-ffi locally via cargo-ndk (skip Core artifact download)"
        type: boolean
        default: false

permissions:
  contents: read
  # upload-artifact 在显式 permissions 下需要 actions: write；不授予 contents: write。
  actions: write

jobs:
  build:
    runs-on: ubuntu-26.04
    env:
      # Cross-repo artifact download: WDMM_CORE_READ_TOKEN is a PAT with
      # actions:read on SenkjM/WDMM-core. Falls back to GITHUB_TOKEN when
      # both repos share visibility (same user/org).
      GH_TOKEN: ${{ secrets.WDMM_CORE_READ_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          # 需要完整标签来找最新正式版。
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install Android SDK compile dependencies
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found; leaving SDK components to Gradle."
            exit 0
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install dependencies
        run: flutter pub get

      # ── Core artifact download (default path) ────────────────────────────
      # Reads the submodule SHA pinned in this repo, then scans the last 20
      # successful runs of native-artifacts on feat/proxy-hls-ffmpeg in
      # SenkjM/WDMM-core. Downloads the first run whose COMMIT.txt matches
      # exactly. Fails clearly if none found — do NOT fall back silently.
      - name: Download libwdmm_ffi.so from Core CI
        if: ${{ !inputs.build_core_locally }}
        run: |
          set -euo pipefail
          CORE_SHA="$(git -C rust/wdmm-core rev-parse HEAD)"
          echo "Core submodule SHA: $CORE_SHA"

          SO_DEST="android/app/src/main/jniLibs/arm64-v8a/libwdmm_ffi.so"
          mkdir -p "$(dirname "$SO_DEST")"

          MATCHED_RUN=""
          while IFS= read -r run_id; do
            TMPDIR_ART="$(mktemp -d)"
            if gh run download "$run_id" \
                --repo SenkjM/WDMM-core \
                -n wdmm-ffi-android-arm64 \
                -D "$TMPDIR_ART" 2>/dev/null; then
              COMMIT_FILE="$TMPDIR_ART/COMMIT.txt"
              if [ -f "$COMMIT_FILE" ]; then
                ART_SHA="$(tr -d '[:space:]' < "$COMMIT_FILE")"
                if [ "$ART_SHA" = "$CORE_SHA" ]; then
                  cp "$TMPDIR_ART/libwdmm_ffi.so" "$SO_DEST"
                  MATCHED_RUN="$run_id"
                  rm -rf "$TMPDIR_ART"
                  break
                fi
              fi
            fi
            rm -rf "$TMPDIR_ART"
          done < <(gh run list \
            --repo SenkjM/WDMM-core \
            --workflow native-artifacts.yml \
            --branch feat/proxy-hls-ffmpeg \
            --status success \
            --limit 20 \
            --json databaseId \
            --jq '.[].databaseId')

          if [ -z "$MATCHED_RUN" ]; then
            echo "::error::No successful native-artifacts run found for Core SHA ${CORE_SHA}."
            echo "::error::Dispatch SenkjM/WDMM-core → native-artifacts on feat/proxy-hls-ffmpeg at that commit first."
            exit 1
          fi
          if [ ! -f "$SO_DEST" ]; then
            echo "::error::libwdmm_ffi.so not found after download."
            exit 1
          fi
          echo "libwdmm_ffi.so ready (run $MATCHED_RUN, Core SHA $CORE_SHA)"

      # ── Local Core compile (emergency / override path) ───────────────────
      # Gate these steps behind build_core_locally=true so the default CI path
      # does not pay for Rust + NDK installation time.
      - name: Install Rust toolchain
        if: ${{ inputs.build_core_locally }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        if: ${{ inputs.build_core_locally }}
        # cargo-ndk translates cargo build targets to Android ABI names.
        run: cargo install cargo-ndk

      - name: Setup NDK for cargo-ndk
        if: ${{ inputs.build_core_locally }}
        run: |
          set -euo pipefail
          # Resolve the NDK version that Flutter/AGP expect so we use a
          # consistent toolchain without hard-coding a version that drifts.
          FLUTTER_ROOT=$(flutter --version --machine 2>/dev/null \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('flutterRoot',''))" \
            2>/dev/null || true)
          NDK_VER=""
          if [ -n "$FLUTTER_ROOT" ]; then
            NDK_VER=$(grep -oP "(?<=ndkVersion = ')[0-9.]+" \
              "${FLUTTER_ROOT}/packages/flutter_tools/lib/src/android/android_sdk.dart" \
              2>/dev/null | head -1 || true)
          fi
          NDK_VER="${NDK_VER:-27.0.12077973}"
          echo "Installing NDK ${NDK_VER}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;${NDK_VER}"
          NDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}/ndk/${NDK_VER}"
          echo "ANDROID_NDK_HOME=${NDK_PATH}" >> "$GITHUB_ENV"
          echo "NDK_HOME=${NDK_PATH}" >> "$GITHUB_ENV"

      - name: Build wdmm-ffi for arm64-v8a
        if: ${{ inputs.build_core_locally }}
        run: |
          set -euo pipefail
          cd rust/wdmm-core
          cargo ndk -t arm64-v8a \
            -o ../../android/app/src/main/jniLibs \
            build --release -p wdmm-ffi
          SO="../../android/app/src/main/jniLibs/arm64-v8a/libwdmm_ffi.so"
          if [ ! -f "$SO" ]; then
            echo "::error::libwdmm_ffi.so not found; cargo-ndk output path may differ."
            exit 1
          fi
          echo "libwdmm_ffi.so ready at $SO"

      # ── Version + sign + build ────────────────────────────────────────────
      - name: Compute test version
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # 最新正式版：合法 vX.Y.Z 标签（规则同 .github/scripts/version-gate.sh）里最高的一个。
          base="$(git tag -l 'v*' \
            | grep -E '^v(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)$' \
            | sort -V | tail -n 1 || true)"
          if [ -z "$base" ]; then
            echo "::error::没有合法的 vX.Y.Z 正式版标签，无法生成 Testbuild 版本号。"
            exit 1
          fi
          short="$(git rev-parse --short=7 HEAD)"
          t="${base#v}"
          major="${t%%.*}"; rest="${t#*.}"; minor="${rest%%.*}"; patch="${rest#*.}"
          if [ "$RUN_NUMBER" -lt 1 ] || [ "$RUN_NUMBER" -gt 9999 ]; then
            echo "::error::run_number=${RUN_NUMBER} 超出 1–9999，versionCode 会越过下一个修订号。"
            exit 1
          fi
          code=$(( major * 100000000 + minor * 1000000 + patch * 10000 + RUN_NUMBER ))
          name="${base}-${short}"
          echo "Testbuild version: ${name} (${code}); base=${base}"
          {
            echo "version_name=${name}"
            echo "version_code=${code}"
          } >> "$GITHUB_OUTPUT"

      - name: Decode sandbox keystore
        env:
          ANDROID_SANDBOX_KEYSTORE_BASE64: ${{ secrets.ANDROID_SANDBOX_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_SANDBOX_KEYSTORE_BASE64:-}" ]; then
            echo "Missing secret ANDROID_SANDBOX_KEYSTORE_BASE64 — cannot produce a stable-signed sandbox APK."
            exit 1
          fi
          echo "$ANDROID_SANDBOX_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/android/app/sandbox.jks"
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/sandbox.jks" >> "$GITHUB_ENV"

      - name: Build arm64-v8a test APK
        env:
          ANDROID_SANDBOX_KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          ANDROID_SANDBOX_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SANDBOX_KEYSTORE_PASSWORD }}
          ANDROID_SANDBOX_KEY_ALIAS: ${{ secrets.ANDROID_SANDBOX_KEY_ALIAS }}
          ANDROID_SANDBOX_KEY_PASSWORD: ${{ secrets.ANDROID_SANDBOX_KEY_PASSWORD }}
        run: |
          flutter build apk --release --flavor sandbox --target-platform android-arm64 \
            --build-name="${{ steps.version.outputs.version_name }}" \
            --build-number="${{ steps.version.outputs.version_code }}"

      - name: Upload testbuild APK
        uses: actions/upload-artifact@v7
        with:
          name: testbuild-arm64-v8a
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
