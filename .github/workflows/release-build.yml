name: Release Build

# 正式版的检查、编译与发版，同一流程内串行：check → build → release。
# 发版直接用同一次运行的产物，不再由 workflow_run 接续。编译步骤保持不变。

on:
  push:
    tags:
      - "v*"
      - "!v*-*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（必填，例如 0.1.0 或 v0.1.0；只给当前 main 打标签）"
        required: true
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: android-versioned-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-26.04
    outputs:
      proceed: ${{ steps.decision.outputs.proceed }}
      tag: ${{ steps.decision.outputs.tag }}
      version_name: ${{ steps.decision.outputs.version_name }}
      version_code: ${{ steps.decision.outputs.version_code }}
      short_sha: ${{ steps.decision.outputs.short_sha }}
      prev_tag: ${{ steps.decision.outputs.prev_tag }}
      compare: ${{ steps.decision.outputs.compare }}
      sha: ${{ steps.decision.outputs.sha }}
    steps:
      # 手动发版会在这一步之后推 v 标签。只要该提交改动过 .github/workflows，
      # GITHUB_TOKEN 就会被拒（refusing to allow a GitHub App to create or update workflow），
      # 所以这里用带 workflows 权限的 RELEASE_TOKEN，并让它留在本地凭据里。
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Check release tag
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_MODE: release
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/version-gate.sh

  build:
    needs: check
    if: needs.check.outputs.proceed == 'true'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.check.outputs.sha }}
          # The Rust shared library is built from the `rust/wdmm-core` submodule;
          # without this the checkout leaves the directory empty and the build
          # fails inside `cargo ndk`.
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install Android SDK compile dependencies
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found; leaving SDK components to Gradle."
            exit 0
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install libmpv (media_kit native backend for `flutter test` on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev mpv

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Setup NDK for cargo-ndk
        run: |
          set -euo pipefail
          # Pin the same NDK version used by build-ffmpeg-android.yml and
          # android/app/build.gradle.kts so the Rust toolchain, FFmpeg shared
          # libs, and Gradle all use a single consistent sysroot.
          NDK_VER="28.2.13676358"
          echo "Installing NDK ${NDK_VER}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;${NDK_VER}"
          NDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}/ndk/${NDK_VER}"
          echo "ANDROID_NDK_HOME=${NDK_PATH}" >> "$GITHUB_ENV"
          echo "NDK_HOME=${NDK_PATH}" >> "$GITHUB_ENV"

      - name: Download FFmpeg Android shared libs
        # Fetch the FFmpeg shared libs produced by build-ffmpeg-android.yml.
        # They live under the rolling release tag `ffmpeg-android-libs`.
        # Release builds need arm64-v8a and x86_64 for --split-per-abi.
        # armeabi-v7a is not supported: FFmpeg excludes it (LP64-only struct
        # offsets) and wdmm-ffi has no armv7 Rust target.
        run: |
          set -euo pipefail
          JNILIBS="android/app/src/main/jniLibs"
          TMPLIBS="${{ runner.temp }}/ffmpeg-android-libs"
          mkdir -p "$TMPLIBS"
          for abi in arm64-v8a x86_64; do
            mkdir -p "${JNILIBS}/${abi}"
            tarball="${TMPLIBS}/ffmpeg-android-${abi}.tar.gz"
            gh release download ffmpeg-android-libs \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "ffmpeg-android-${abi}.tar.gz" \
              --output "$tarball"
            tar -xzf "$tarball" -C "$TMPLIBS"
            cp "${TMPLIBS}/${abi}/lib"*.so "${JNILIBS}/${abi}/"
            echo "FFmpeg libs for ${abi}: $(ls "${JNILIBS}/${abi}"/*.so | wc -l) .so files"
          done
          # Absolute paths: the build step below runs from `rust/wdmm-core`, and a
          # relative link-search path would resolve against the wrong directory.
          echo "WDMM_FFMPEG_LIB_DIR_ARM64=${GITHUB_WORKSPACE}/${JNILIBS}/arm64-v8a" >> "$GITHUB_ENV"
          echo "WDMM_FFMPEG_LIB_DIR_X86_64=${GITHUB_WORKSPACE}/${JNILIBS}/x86_64" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build wdmm-ffi for arm64-v8a and x86_64
        # armeabi-v7a is not built: FFmpeg has no v7a libs (LP64-only struct
        # offsets) and the split APK for v7a is intentionally absent.
        run: |
          set -euo pipefail
          cd rust/wdmm-core
          for abi in arm64-v8a x86_64; do
            if [ "$abi" = "arm64-v8a" ]; then
              export WDMM_FFMPEG_LIB_DIR="$WDMM_FFMPEG_LIB_DIR_ARM64"
            else
              export WDMM_FFMPEG_LIB_DIR="$WDMM_FFMPEG_LIB_DIR_X86_64"
            fi
            cargo ndk -t "$abi" \
              -o ../../android/app/src/main/jniLibs \
              build --release -p wdmm-ffi --features ffmpeg
            SO="../../android/app/src/main/jniLibs/${abi}/libwdmm_ffi.so"
            if [ ! -f "$SO" ]; then
              echo "::error::libwdmm_ffi.so not found for ${abi}"
              exit 1
            fi
            echo "libwdmm_ffi.so ready for ${abi} at $SO"
          done

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "Missing secret ANDROID_KEYSTORE_BASE64 — cannot produce a signed release."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/android/app/release.jks"
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/release.jks" >> "$GITHUB_ENV"

      - name: Build split APKs (per ABI)
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # force-version-code-ignoring-abi：关掉 Flutter 分包时给 versionCode
          # 加 ABI 偏移（abi*1000）的行为。否则 arm64-v8a 的 versionCode 会比
          # 下一个预发布 tag 里编码的 code 大 2000，应用内更新检查永远判定
          # 「已是最新」。两个 ABI 包 versionCode 相同对 GitHub Release 侧载无影响。
          # armeabi-v7a 不出包：FFmpeg 没有 v7a 共享库，wdmm-ffi 也无 armv7 Rust 目标，
          # v7a APK 缺 libwdmm_ffi.so 会在启动时崩溃。
          flutter build apk --release --flavor prod \
            --target-platform android-arm64,android-x64 \
            --split-per-abi \
            --build-name="${{ needs.check.outputs.version_name }}" \
            --build-number="${{ needs.check.outputs.version_code }}" \
            -P force-version-code-ignoring-abi=true

      - name: Collect split APKs
        run: |
          set -euo pipefail
          V="${{ needs.check.outputs.version_name }}"
          # split APK 的实际文件名由构建工具决定，不要写死：Flutter 3.47.5 出的是
          # app-<abi>-prod-release.apk（ABI 在前），旧版曾是 app-prod-<abi>-release.apk。
          # 原来写死旧名称，于是 cp 报 "No such file or directory" 且看不到目录里有什么。
          echo "== flutter-apk 目录内容 =="
          ls -l build/app/outputs/flutter-apk || true
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-prod-release.apk "dist/webdav-media-manager-${V}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-prod-release.apk "dist/webdav-media-manager-${V}-x86_64.apk"

      - name: Build app bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Match the APK split: no armeabi-v7a (FFmpeg has no v7a libs and
          # libwdmm_ffi.so has no armv7 target), otherwise the bundle would ship
          # a v7a APK that crashes at startup.
          flutter build appbundle --release --flavor prod \
            --target-platform android-arm64,android-x64 \
            --build-name="${{ needs.check.outputs.version_name }}" \
            --build-number="${{ needs.check.outputs.version_code }}"

      - name: Collect app bundle and metadata
        run: |
          set -euo pipefail
          V="${{ needs.check.outputs.version_name }}"
          mkdir -p dist
          cp build/app/outputs/bundle/prodRelease/app-prod-release.aab "dist/webdav-media-manager-${V}.aab"
          {
            printf 'tag=%s\n' "${{ needs.check.outputs.tag }}"
            printf 'version_name=%s\n' "${{ needs.check.outputs.version_name }}"
            printf 'version_code=%s\n' "${{ needs.check.outputs.version_code }}"
            printf 'short_sha=%s\n' "${{ needs.check.outputs.short_sha }}"
            printf 'prev_tag=%s\n' "${{ needs.check.outputs.prev_tag }}"
            printf 'compare=%s\n' "${{ needs.check.outputs.compare }}"
            printf 'sha=%s\n' "${{ needs.check.outputs.sha }}"
          } > dist/meta.env

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: dist
          if-no-files-found: error
  release:
    needs: [check, build]
    if: needs.check.outputs.proceed == 'true'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: main

      - name: Download release bundle
        uses: actions/download-artifact@v7
        with:
          name: release-bundle
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::缺少 secret RELEASE_TOKEN。目标提交相对默认分支改过 .github/workflows 时，GITHUB_TOKEN 不能创建 Release，需要带 Workflows 写权限的 token。"
            exit 1
          fi
          meta() { sed -n "s/^${1}=//p" dist/meta.env | head -n 1; }
          tag="$(meta tag)"
          version_name="$(meta version_name)"
          version_code="$(meta version_code)"
          prev_tag="$(meta prev_tag)"
          sha="$(meta sha)"
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            # 同 tag 已有 release：清理残留 asset 后重传，不新开一张（重跑/补包场景）。
            # 每次发版先清空旧 asset，避免用户下到过期包（用户要求）。
            gh release view "$tag" --repo "$REPO" --json assets \
              --jq '.assets[].name' | while IFS= read -r name; do
                [ -n "$name" ] || continue
                echo "删除旧 asset：$name"
                gh release delete-asset "$tag" "$name" --repo "$REPO" --yes
              done
            gh release upload "$tag" dist/*.apk dist/*.aab --repo "$REPO" --clobber
            echo "Release ${tag} 已更新（asset 已刷新）。"
            exit 0
          fi
          changes="$(bash .github/scripts/commit-list.sh "$prev_tag" "$sha")"
          notes="$(mktemp)"
          {
            printf 'Webdav Media Manager\n\n'
            printf -- '- 版本：`%s`（versionCode `%s`）\n' "$version_name" "$version_code"
            printf -- '- 上一个正式版：`%s`\n\n' "${prev_tag:-无}"
            if [ -n "$prev_tag" ]; then
                printf '相对于上一版本 `%s`：\n\n%s\n' "$prev_tag" "$changes"
            else
                printf '本次变更：\n\n%s\n' "$changes"
            fi
          } > "$notes"
          gh release create "$tag" dist/*.apk dist/*.aab \
            --repo "$REPO" \
            --target "$sha" \
            --title "${version_name}" \
            --notes-file "$notes" \
            --latest

      - name: Sync release data to Cloudflare Worker
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${SYNC_TOKEN:-}" ]; then
            echo "::warning::缺少 secret SYNC_TOKEN，跳过同步。"
            exit 0
          fi
          # 拉取最新 releases（含刚才创建的），生成 sync payload
          gh api repos/$REPO/releases?per_page=30 \
            > dist/releases.json
          jq '{ releases: . }' dist/releases.json > dist/sync-payload.json
          curl -sf -X POST https://update.senkjm.top/_sync \
            -H "x-sync-token: $SYNC_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@dist/sync-payload.json" || \
            echo "::warning::同步失败，但 release 已创建，不阻断。"
