name: Pre-release Build

# 预发布的检查、编译与发版，同一流程内串行：check → build → release。
# 发版直接用同一次运行的产物，不再由 workflow_run 接续。编译步骤保持不变。
# 没有合法标签或不需要构建时，不上传产物。

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: android-versioned-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-26.04
    outputs:
      proceed: ${{ steps.decision.outputs.proceed }}
      version_name: ${{ steps.decision.outputs.version_name }}
      version_code: ${{ steps.decision.outputs.version_code }}
      short_sha: ${{ steps.decision.outputs.short_sha }}
      base_tag: ${{ steps.decision.outputs.base_tag }}
      sha: ${{ steps.decision.outputs.sha }}
      seq: ${{ steps.decision.outputs.seq }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event_name == 'schedule' && 'beta' || github.ref }}

      - name: Check whether a pre-release can run
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_MODE: prerelease
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ""
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/version-gate.sh

  build:
    needs: check
    if: needs.check.outputs.proceed == 'true'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.check.outputs.sha }}

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install Android SDK compile dependencies
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found; leaving SDK components to Gradle."
            exit 0
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install libmpv (media_kit native backend for `flutter test` on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev mpv

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Decode internal keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "Missing secret ANDROID_KEYSTORE_BASE64 — cannot produce a stable-signed APK."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/android/app/internal-release.jks"
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/internal-release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-name="${{ needs.check.outputs.version_name }}" \
            --build-number="${{ needs.check.outputs.version_code }}"

      - name: Build app bundle (optional)
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build appbundle --release \
            --build-name="${{ needs.check.outputs.version_name }}" \
            --build-number="${{ needs.check.outputs.version_code }}"
        continue-on-error: true

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/app-release.apk
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
            cp build/app/outputs/bundle/release/app-release.aab dist/app-release.aab
          fi
          {
            printf 'version_name=%s\n' "${{ needs.check.outputs.version_name }}"
            printf 'version_code=%s\n' "${{ needs.check.outputs.version_code }}"
            printf 'short_sha=%s\n' "${{ needs.check.outputs.short_sha }}"
            printf 'base_tag=%s\n' "${{ needs.check.outputs.base_tag }}"
            printf 'sha=%s\n' "${{ needs.check.outputs.sha }}"
            printf 'seq=%s\n' "${{ needs.check.outputs.seq }}"
          } > dist/meta.env

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pre-release-bundle
          path: dist
          if-no-files-found: error
  release:
    needs: [check, build]
    if: needs.check.outputs.proceed == 'true'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: beta

      - name: Download pre-release bundle
        uses: actions/download-artifact@v7
        with:
          name: pre-release-bundle
          path: dist

      - name: Publish Pre-release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::缺少 secret RELEASE_TOKEN。目标提交相对默认分支改过 .github/workflows 时，GITHUB_TOKEN 不能创建 Release，需要带 Workflows 写权限的 token。"
            exit 1
          fi
          meta() { sed -n "s/^${1}=//p" dist/meta.env | head -n 1; }
          version_name="$(meta version_name)"
          version_code="$(meta version_code)"
          short_sha="$(meta short_sha)"
          base_tag="$(meta base_tag)"
          sha="$(meta sha)"
          seq="$(meta seq)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a prerelease "$sha" -f -m "$(printf 'version_name=%s\nversion_code=%s\nbase_tag=%s\nseq=%s\nsha=%s\n' "$version_name" "$version_code" "$base_tag" "$seq" "$sha")"
          git -c credential.helper= -c "http.extraHeader=Authorization: Bearer ${GH_TOKEN}" push "https://github.com/${REPO}.git" "+refs/tags/prerelease:refs/tags/prerelease"
          git fetch origin main --tags --force
          script="$(mktemp)"
          git show origin/main:.github/scripts/commit-list.sh > "$script"
          changes="$(bash "$script" "$base_tag" "$sha")"
          notes="$(mktemp)"
          {
            printf '自动构建的 Pre-release（来自 **beta** 分支，AGPL-3.0）。\n\n'
            printf -- '- 版本：`%s`（versionCode `%s`）\n' "$version_name" "$version_code"
            printf -- '- 基准正式版：`%s`\n\n' "$base_tag"
            printf '自上一正式版以来：\n\n%s\n\n' "$changes"
            printf 'base_tag=%s\nseq=%s\nsha=%s\n' "$base_tag" "$seq" "$sha"
          } > "$notes"
          if gh release view prerelease --repo "$REPO" >/dev/null 2>&1; then
            gh release edit prerelease --repo "$REPO" --target "$sha" --title "Pre-release ${version_name} (${version_code})" --notes-file "$notes" --prerelease
            gh release upload prerelease dist/app-release.apk --repo "$REPO" --clobber
          else
            gh release create prerelease dist/app-release.apk --repo "$REPO" --target "$sha" --title "Pre-release ${version_name} (${version_code})" --notes-file "$notes" --prerelease
          fi
