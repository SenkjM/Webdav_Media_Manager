<?xml version="1.0" encoding="UTF-8"?>
<!--
  Webdav Media Manager - icon/logo.svg

  基于 OpenList 图标 "logo (1).svg"（字母图形 l + r，sky-400 / teal-200）
  的衍生作品，按本项目（WebDAV 网盘媒体管理器）特点修改：

    - 原图标整体缩放至约 78% 并置于画布上方（字形与配色未改动）；
    - 底部新增渠道徽章风格绶带（sky-500），样式参考 Chrome Dev/Beta
      渠道图标的底部横幅；
    - 绶带中央以白色齿轮图形（而非文字）表达 "Manager" 管理定位。

  本图标以 CC BY-NC-SA 4.0 许可证发布，详见本目录下 LICENSE 文件。
-->
<svg id="Base" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <style>
      .cls-1 {
          --sky-400: #38bdf8;
          @supports (color: oklch(0% 0 0)) {
              --sky-400: oklch(74.6% 0.16 232.661);
          }
          fill: var(--sky-400);
      }
      .cls-2 {
          --teal-200: #99f6e4;
          @supports (color: oklch(0% 0 0)) {
              --teal-200: oklch(91% 0.096 180.426);
          }
          fill: var(--teal-200);
      }
      .cls-badge {
          --sky-500: #0ea5e9;
          @supports (color: oklch(0% 0 0)) {
              --sky-500: oklch(68.5% 0.169 237.323);
          }
          fill: var(--sky-500);
      }
      .cls-badge-fg {
          fill: #ffffff;
      }
    </style>
  </defs>
