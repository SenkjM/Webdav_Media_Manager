org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# Stop the Flutter Gradle plugin from forcing defaultConfig.ndk.abiFilters to
# armeabi-v7a/arm64-v8a/x86_64 on non-split builds. AGP unions that with the
# flavor filters, which made sandbox's arm64-only filter a no-op. Each flavor
# now sets its own abiFilters in app/build.gradle.kts (prod/dev keep the same
# three ABIs). No effect on --split-per-abi.
disable-abi-filtering=true

# Proxy stays off this file. CI has no local proxy, and these properties are committed.
# Put systemProp.http(s).proxyHost/proxyPort in ~/.gradle/gradle.properties on the machine that needs it.
